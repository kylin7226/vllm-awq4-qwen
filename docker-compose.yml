services:
  vllm:
    image: vllm-awq4-qwen:builder
    build:
      context: .
      args:
        VLLM_COMMIT: ${VLLM_COMMIT:-v0.20.0}
    container_name: vllm-awq4-qwen
    # Manual control only. NEVER auto-restart on host reboot  -  this rig
    # is the user's daily-driver PC; if it crashes during a kernel test
    # we want it to stay down so the user can inspect logs from a phone.
    restart: "no"
    privileged: true
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    ports:
      # Bind to all host interfaces so containers in other docker networks
      # can reach vLLM via host.docker.internal / the docker bridge gateway.
      # Loopback-only ("127.0.0.1:8000:8000") blocks cross-container traffic
      # because the kernel won't deliver bridge-arriving packets to a
      # loopback-bound port. See: external API container needs vLLM access.
      - "${VLLM_HOST_PORT:-8000}:8000"
    volumes:
      # Host-mounted model cache. Must contain the HuggingFace hub/ subdir
      # with cyankiwi/Qwen3.6-27B-AWQ-INT4 snapshot fetched via:
      #   hf download cyankiwi/Qwen3.6-27B-AWQ-INT4 --cache-dir $VLLM_HOST_MODELS_DIR/hub
      - ${VLLM_HOST_MODELS_DIR}:/models:ro
      # Persist Triton JIT cache across restarts.
      - ${VLLM_HOST_TRITON_CACHE:-./.triton-cache}:/root/.triton/cache
      - ${VLLM_HOST_VLLM_CACHE:-./.vllm-cache}:/root/.cache/vllm
      # Persist profile cache (cached KV memory sizing across restarts).
      - ${VLLM_HOST_VLLM_CACHE:-./.vllm-cache}/profile:/root/.cache/vllm-profile
    ipc: host
    shm_size: "16gb"
    environment:
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"
      HIP_VISIBLE_DEVICES: "0"
      VLLM_ROCM_USE_AITER: "0"
      VLLM_USE_TRITON_AWQ: "1"
      VLLM_DISABLE_COMPILE_CACHE: "1"
      HSA_NO_SCRATCH_RECLAIM: "1"
      MIOPEN_FIND_MODE: FAST
      VLLM_SKIP_MEMORY_PROFILING: "1"
      VLLM_PROFILE_CACHE_DIR: "/root/.cache/vllm-profile"
      # Service mode + runtime defaults (mirrors Dockerfile ENV, overridden here)
      SERVICE_MODE: llm
      VLLM_MODEL_ID: ${VLLM_MODEL_ID:-cyankiwi/Qwen3.6-27B-AWQ-INT4}
      VLLM_SERVED_MODEL_NAME: ${VLLM_SERVED_MODEL_NAME:-Qwen3.6-27B-AWQ4}
      VLLM_GPU_MEMORY_UTIL: "${VLLM_GPU_MEMORY_UTIL:-0.9}"
      VLLM_MAX_NUM_SEQS: "${VLLM_MAX_NUM_SEQS:-1}"
      VLLM_MAX_MODEL_LEN: "${VLLM_MAX_MODEL_LEN:-262144}"
      VLLM_SPECULATIVE_CONFIG: '{"method":"dflash","model":"${VLLM_DFLASH_MODEL:-z-lab/Qwen3.6-27B-DFlash}","num_speculative_tokens":${VLLM_DFLASH_N:-8}}'
    # Entrypoint assembles `vllm serve` from the env vars above — no command override.

  # Qwen3-ASR — speech-to-text service (separate container; vLLM cannot
  # serve a text LLM and an ASR model in one instance). Three modes on
  # one endpoint: non-streaming (POST /v1/audio/transcriptions), SSE
  # streaming (same URL + stream=true), and WebSocket realtime
  # (ws://host/v1/realtime, PCM16 chunks → live transcription).
  vllm-asr:
    image: vllm-awq4-qwen:builder
    build:
      context: .
      args:
        VLLM_COMMIT: ${VLLM_COMMIT:-v0.20.0}
    container_name: vllm-asr
    restart: "no"
    privileged: true
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    ports:
      - "${VLLM_ASR_HOST_PORT:-8001}:8000"
    volumes:
      - ${VLLM_HOST_MODELS_DIR}:/models:ro
      - ${VLLM_HOST_VLLM_CACHE:-./.vllm-cache}:/root/.cache/vllm
      - ${VLLM_HOST_VLLM_CACHE:-./.vllm-cache}/profile:/root/.cache/vllm-profile
    ipc: host
    shm_size: "16gb"
    environment:
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"
      HIP_VISIBLE_DEVICES: "0"
      VLLM_ROCM_USE_AITER: "0"
      VLLM_USE_TRITON_AWQ: "1"
      VLLM_DISABLE_COMPILE_CACHE: "1"
      HSA_NO_SCRATCH_RECLAIM: "1"
      HSA_OVERRIDE_GFX_VERSION: "11.5.1"
      MIOPEN_FIND_MODE: FAST
      FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
      VLLM_MAX_AUDIO_CLIP_FILESIZE_MB: "25"
      VLLM_SKIP_MEMORY_PROFILING: "1"
      VLLM_PROFILE_CACHE_DIR: "/root/.cache/vllm-profile"
      # Service mode + ASR runtime defaults
      SERVICE_MODE: asr
      VLLM_ASR_MODEL_ID: ${VLLM_ASR_MODEL_ID:-Qwen/Qwen3-ASR-8B}
      VLLM_ASR_HOST_PORT: "${VLLM_ASR_HOST_PORT:-8001}"
      VLLM_ASR_GPU_MEMORY_UTIL: "${VLLM_ASR_GPU_MEMORY_UTIL:-0.9}"
      VLLM_ASR_MAX_NUM_SEQS: "${VLLM_ASR_MAX_NUM_SEQS:-1}"
      VLLM_ASR_MAX_MODEL_LEN: "${VLLM_ASR_MAX_MODEL_LEN:-8192}"
      VLLM_ASR_SUPPORTED_TASKS: transcription,realtime
    # Entrypoint assembles `vllm serve` from the env vars above — no command override.
